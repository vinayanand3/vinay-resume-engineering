name: Deploy flight plan to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - vinay-flight-plan.html
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the approved page
        uses: actions/checkout@v7.0.1

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6.0.0

      - name: Prepare the public site
        run: |
          mkdir -p _site
          cp vinay-flight-plan.html _site/index.html
          touch _site/.nojekyll

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0
